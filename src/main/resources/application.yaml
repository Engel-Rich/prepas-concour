spring:
  application:
    name: prepa-concour
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prepa_concour}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    # show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  servlet:
    context-path: /api/v1
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
