spring:
  application:
    name: prepa-concour

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  datasource:
    url:                  ${DB_URL:jdbc:postgresql://localhost:5432/prepa_concour}
    username:             ${DB_USERNAME:postgres}
    password:             ${DB_PASSWORD:password}
    driver-class-name:    org.postgresql.Driver

  flyway:
    out-of-order: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

minio:
  url:         ${MINIO_URL:http://localhost:9000}
  endpoint:    ${MINIO_ENDPOINT:http://localhost:9000}
  public-url:  ${MINIO_PUBLIC_URL:http://localhost:9000}
  bucket-name: ${MINIO_BUCKET:prepasbucket}
  access-key:  ${MINIO_ACCESS_KEY:prepa-db-root}
  secret-key:  ${MINIO_SECRET_KEY:prepa-db-pass}

video:
  encryption:
    # Clé maîtresse AES-256 en base64 (32 octets décodés).
    # Absente = chiffrement désactivé, les vidéos sont déposées en clair.
    # Générer : openssl rand -base64 32
    master-key: ${VIDEO_ENCRYPTION_MASTER_KEY:}

payment:
  campay:
    url:      ${CAMPAY_URL:https://demo.campay.net/api}
    username: ${CAMPAY_USERNAME:""}
    password: ${CAMPAY_PASSWORD:""}
  mundi_pay:
    api_key: ""
    api_secret: ''
    url: ""

mail:
  resend:
    url:    ${RESEND_URL:https://api.resend.com}
    apiKey: ${RESEND_API_KEY:re_placeholder}
    from:   ${RESEND_FROM:Prepa Concours <noreply@mutrix.org>}

sms:
